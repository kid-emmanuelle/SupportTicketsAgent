name: Check Source Branch

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

jobs:
    check-source:
        runs-on: ubuntu-latest
        steps:
            - name: Verify PR targets main
              if: github.base_ref != 'main'
              run: |
                  echo "Skipping: This workflow only runs for PRs to main"
                  exit 0

            - name: Verify develop branch source
              if: github.base_ref == 'main' && github.head_ref != 'develop'
              run: |
                  echo "Error: Only 'develop' can be rebased into 'main'."
                  exit 1
